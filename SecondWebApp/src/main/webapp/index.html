<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signup Form</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        background: white;
        padding: 40px;
        width: 350px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #555;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
    }

    input[type="text"]:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #667eea;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background-color: #5563d1;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Create Account</h2>
    <form method="post" action="./firstServlet">
        
        <div class="form-group">
            <label>User Name</label>
            <input type="text" name="uname" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>User City</label>
            <input type="text" name="ucity" placeholder="Enter your city" required>
        </div>

        <button type="submit" class="btn">Sign Up</button>

    </form>
</div>

</body>
</html>
